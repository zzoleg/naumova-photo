<style>
:root { --bg: #0a0a0a; --text: #e5dfd3; --muted: #8a857b; --accent: #d4883a; --accent-light: #e8a74d; --font-serif: 'EB Garamond', serif; --font-sans: 'Montserrat', sans-serif; --font-display: 'Sedan', serif; --font-black: 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-serif); }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9997; padding: 20px 40px; display: flex; align-items: center; background: rgba(10,10,10,.95); backdrop-filter: blur(10px); }
.nav-left { position: absolute; left: 30px; top: 20px; }
.nav-logo { font-family: 'Sedan', serif; font-size: 1.2rem; letter-spacing: .15em; color: #f28705; text-decoration: none; }
.nav-right { position: absolute; right: 40px; top: 20px; display: flex; align-items: center; gap: 16px; }
.nav-links { display: flex; gap: 24px; list-style: none; }
.nav-links a { color: var(--text); text-decoration: none; font-family: var(--font-sans); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; transition: color .3s; }
.nav-links a:hover { color: var(--accent); }
.album-header { padding: 120px 48px 40px; max-width: 1200px; margin: 0 auto; }
.album-header .label { font-family: var(--font-sans); font-size: .75rem; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.album-header h1 { font-size: 22.5pt; font-weight: 900; font-family: 'Barlow', sans-serif; color: #f28705; }
.album-header .back-link { display: inline-block; margin-top: 12px; color: var(--muted); text-decoration: none; font-family: var(--font-sans); font-size: .8rem; letter-spacing: .1em; transition: color .3s; }
.album-header .back-link:hover { color: var(--accent); }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 4px; padding: 0 48px 80px; max-width: 1400px; margin: 0 auto; }
.album-photo { overflow: hidden; cursor: pointer; aspect-ratio: 3/4; }
.album-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s, filter .5s; filter: grayscale(.15) brightness(.9); }
.album-photo:hover img { transform: scale(1.05); filter: grayscale(0) brightness(1); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 48px; cursor: pointer; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
.lightbox-close { position: absolute; top: 24px; right: 32px; color: var(--text); font-size: 2rem; cursor: pointer; background: none; border: none; width: 48px; height: 48px; transition: opacity .3s; }
.lightbox-close:hover { opacity: .6; }
@media (max-width: 768px) { .album-grid { grid-template-columns: repeat(2, 1fr); padding: 0 16px 60px; } .album-header { padding: 100px 16px 24px; } .album-grid { gap: 2px; } .album-photo { aspect-ratio: 3/4; } nav { padding: 16px 20px; } .nav-links { display: none; } }

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
</div>

<script>
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox(e) {
  if (e) e.stopPropagation();
  document.getElementById('lightbox').classList.remove('active');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
</script>
