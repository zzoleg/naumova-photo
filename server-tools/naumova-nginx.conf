server {
    listen 80;
    listen [::]:80;
    server_name naumova.ofskinandsouls.com www.ofskinandsouls.com;

    root /var/www/site-ofskin/webroot;
    index index.html;

    # Hotlink protection for images
    location ~* \.(jpg|jpeg|png|gif)$ {
        valid_referers none blocked server_names
            ~\.ofskinandsouls\.com$
            ~\.naumova\.ofskinandsouls\.com$;

        if ($invalid_referer) {
            return 403;
        }

        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Static files (CSS, JS, fonts)
    location ~* \.(ico|css|js|ttf|woff|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 403 /403.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml font/ttf font/woff font/woff2;
    gzip_vary on;
}
